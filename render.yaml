services:
  - type: web
    name: croissant-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FORCE_CPU
        value: "true"
      - key: CACHE_DIR
        value: /app/.cache
      - key: JOB_STATE_DB
        value: /tmp/croissant/jobs.sqlite3
      - key: STT_PROVIDER
        value: freeai
      - key: PUBLIC_BASE_URL
        value: https://croissant-api.onrender.com
      - key: FREE_AI_STT_MODEL
        value: whisper
      - key: CORS_ORIGINS
        value: https://croissant-web.onrender.com,http://localhost:3000
      - key: FREE_AI_API_KEY
        sync: false

  - type: web
    name: croissant
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://croissant-api.onrender.com
